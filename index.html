<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLEAR FLEET - Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #020b1a;
            --accent: #00d4ff;
            --dark-blue: #0a192f;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: var(--primary);
            color: var(--white);
            overflow-x: hidden;
        }

        /* زر تبديل اللغة */
        .lang-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 9999;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,212,255,0.4);
            font-size: 1.1rem;
        }

        .page { display: none; animation: fadeIn 0.8s ease; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* واجهة ياماتو الرئيسية */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(2, 11, 26, 1)), 
                        url('https://images.alphacoders.com/610/610669.jpg');
            background-size: cover;
            background-position: center;
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 6px solid var(--accent);
        }

        .hero h1 {
            font-size: clamp(3rem, 12vw, 6.5rem);
            color: var(--accent);
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.9);
            margin: 0;
            font-family: sans-serif;
            letter-spacing: 10px;
        }

        .hero p { font-size: 1.6rem; margin-top: 15px; color: #a0c4ff; }

        /* شريط البيانات السريعة */
        .stats-summary {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: -70px;
            padding: 0 20px;
        }

        .summary-card {
            background: rgba(15, 23, 42, 0.95);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--accent);
            min-width: 100px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .summary-card h3 { color: var(--accent); margin: 0; font-size: 2rem; }
        .summary-card p { font-size: 0.9rem; margin: 5px 0 0 0; color: #94a3b8; }

        /* قسم التجنيد (ميزوري) */
        .recruit-area {
            background: linear-gradient(rgba(2, 11, 26, 0.9), rgba(2, 11, 26, 0.9)), 
                        url('https://images6.alphacoders.com/652/652225.jpg');
            background-size: cover;
            background-position: center;
            padding: 100px 20px;
            margin-top: 80px;
        }

        .form-box {
            max-width: 600px;
            margin: auto;
            background: rgba(10, 25, 47, 0.98);
            padding: 45px;
            border-radius: 30px;
            border: 1px solid var(--accent);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        .form-box h2 { color: var(--accent); font-size: 2.3rem; margin-bottom: 40px; text-align: center; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .full-width { grid-column: span 2; }

        label { display: block; margin-bottom: 8px; color: #a0c4ff; font-weight: bold; }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            background: #020b1a;
            border: 1px solid #1e293b;
            color: white;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: inherit;
        }

        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 10px rgba(0,212,255,0.2); }

        .submit-btn {
            background: var(--accent);
            color: #000;
            padding: 20px;
            width: 100%;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover { background: #fff; transform: translateY(-3px); }

        footer { padding: 60px; text-align: center; opacity: 0.6; font-size: 1rem; border-top: 1px solid #1e293b; }

        /* وضعية الإنجليزية */
        html[dir="ltr"] .lang-toggle { right: auto; left: 25px; }
        html[dir="ltr"] label { text-align: left; }
    </style>
</head>
<body>

    <button class="lang-toggle" id="langBtn" onclick="switchLang()">English</button>

    <!-- الصفحة العربية -->
    <div id="arPage" class="page active">
        <div class="hero">
            <h1>CLEAR FLEET</h1>
            <p>استراجيات واضحة.. تعاون ..اللعب كفريق واحد</p>
        </div>

        <div class="stats-summary">
            <div class="summary-card"><h3>41/45</h3><p>الأعضاء</p></div>
            <div class="summary-card"><h3>نشط</h3><p>الحالة</p></div>
            <div class="summary-card"><h3>+1M</h3><p>النفط</p></div>
        </div>

        <section class="recruit-area">
            <div class="form-box">
                <h2>تجنيد المحاربين</h2>
                <form action="https://formspree.io/f/https://formspree.io/f/moeqvgvz" method="POST">
                    <div class="form-grid">
                        <div class="full-width">
                            <label>الاسم في اللعبة (Gamertag):</label>
                            <input type="text" name="player_name" placeholder="مثال: Captain_Clear" required>
                        </div>
                        <div>
                            <label>نسبة الفوز (Win Rate):</label>
                            <input type="text" name="win_rate" placeholder="مثال: 55%" required>
                        </div>
                        <div>
                            <label>معدل الـ KD:</label>
                            <input type="text" name="kd_ratio" placeholder="مثال: 1.5" required>
                        </div>
                        <div class="full-width">
                            <label>عدد المعارك في Standard:</label>
                            <input type="number" name="standard_battles" placeholder="مثال: 2500" required>
                        </div>
                        <div class="full-width">
                            <label>المنصة:</label>
                            <select name="platform">
                                <option>PlayStation</option>
                                <option>Xbox</option>
                                <option>Mobile</option>
                            </select>
                        </div>
                    </div>
                    <label>رسالة للقائد:</label>
                    <textarea name="message" rows="4" placeholder="لماذا تود الانضمام لأسطول CLEAR FLEET؟"></textarea>
                    <button type="submit" class="submit-btn">إرسال الطلب</button>
                </form>
            </div>
        </section>
        <footer>© 2024 CLEAR FLEET - جميع الحقوق محفوظة</footer>
    </div>

    <!-- الصفحة الإنجليزية -->
    <div id="enPage" class="page">
        <div class="hero">
            <h1>CLEAR FLEET</h1>
            <p>Clear Vision.. Superior Power</p>
        </div>

        <div class="stats-summary">
            <div class="summary-card"><h3>32/40</h3><p>Members</p></div>
            <div class="summary-card"><h3>Active</h3><p>Status</p></div>
            <div class="summary-card"><h3>+50k</h3><p>Oil</p></div>
        </div>

        <section class="recruit-area">
            <div class="form-box">
                <h2>Join The Elite</h2>
                <form action="https://formspree.io/f/https://formspree.io/f/moeqvgvz" method="POST">
                    <div class="form-grid">
                        <div class="full-width">
                            <label>In-Game Name (Gamertag):</label>
                            <input type="text" name="player_name" placeholder="Ex: Captain_Clear" required>
                        </div>
                        <div>
                            <label>Win Rate (%):</label>
                            <input type="text" name="win_rate" placeholder="Ex: 55%" required>
                        </div>
                        <div>
                            <label>KD Ratio:</label>
                            <input type="text" name="kd_ratio" placeholder="Ex: 1.5" required>
                        </div>
                        <div class="full-width">
                            <label>Standard Battles Count:</label>
                            <input type="number" name="standard_battles" placeholder="Ex: 2500" required>
                        </div>
                        <div class="full-width">
                            <label>Platform:</label>
                            <select name="platform">
                                <option>PlayStation</option>
                                <option>Xbox</option>
                                <option>Mobile</option>
                            </select>
                        </div>
                    </div>
                    <label>Message to Commander:</label>
                    <textarea name="message" rows="4" placeholder="Why do you want to join CLEAR FLEET?"></textarea>
                    <button type="submit" class="submit-btn">Send Application</button>
                </form>
            </div>
        </section>
        <footer>© 2024 CLEAR FLEET - All Rights Reserved</footer>
    </div>

    <script>
        function switchLang() {
            const ar = document.getElementById('arPage');
            const en = document.getElementById('enPage');
            const btn = document.getElementById('langBtn');
            const html = document.getElementById('mainHtml');

            if (ar.classList.contains('active')) {
                ar.classList.remove('active');
                en.classList.add('active');
                btn.innerText = "العربية";
                html.dir = "ltr";
                html.lang = "en";
            } else {
                en.classList.remove('active');
                ar.classList.add('active');
                btn.innerText = "English";
                html.dir = "rtl";
                html.lang = "ar";
            }
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
